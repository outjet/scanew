name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP tunnel
        run: |
          gcloud compute ssh lkwdscan \
            --project=scanner-423417 \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --command="
              cd /opt/scanew &&
              git pull origin main &&
              /opt/scanew/myenv/bin/pip install -r requirements.txt --quiet &&
              sudo systemctl restart scanew scanew-web
            "
