{% for event in events %}
  <article class="blotter-event">
    <header class="blotter-event-header">
      <span class="blotter-time">{{ event.time }}</span>
      <span class="blotter-nature">{{ event.nature }}</span>
    </header>
    <p class="mb-1">{{ event.summary }}</p>
    {% if event.unitsDispatched %}
      <small class="text-muted">Units: {{ event.unitsDispatched | join(', ') }}</small>
    {% endif %}
  </article>
{% endfor %}

{% if events|length == 0 %}
  <p class="mb-0 text-muted">No significant events to report.</p>
{% endif %}
